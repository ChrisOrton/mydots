# yazi.toml
[mgr]
show_hidden = true
[opener]
play = [
	{ run = "mpv %s", orphan = true, for = "unix" },
]
edit = [
	{ run = "nvim %s", block = true, for = "unix" },
]
open = [
	{ run = "xdg-open %s", desc = "Open" },
]
[plugin]

prepend_previewers = [
    { url = "*.png", run = "image-preview" },
    { url = "*.jpg", run = "image-preview" },
    { url = "*.jpeg", run = "image-preview" },
    { url = "*.gif", run = "image-preview" },
    { url = "*.webp", run = "image-preview" },
    { url = "*.csv", run = "rich-preview"},
    { url = "*.md", run = "rich-preview" },
    { url = "*.rst", run = "rich-preview"},
    { url = "*.ipynb", run = "rich-preview"},
    { url = "*.json", run = "rich-preview"},
#    { url = "*.lang_type", run = "rich-preview"}
]
# ...
